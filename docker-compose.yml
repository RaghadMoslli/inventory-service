version: '3.8'

services:
  # 1. قاعدة البيانات (PostgreSQL أو MySQL حسب متطلبات مشروعكم)
  db:
    image: postgres:15-alpine
    container_name: ecommerce_db
    restart: always
    environment:
      POSTGRES_DB: ecommerce_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. خدمة لارافل الخاصة بكِ (Backend - Laravel)
  laravel-app:
    build:
      context: ./backend/laravel-app
      dockerfile: Dockerfile
    container_name: ecommerce_laravel
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=ecommerce_platform
      - DB_USERNAME=postgres
      - DB_PASSWORD=secretpassword
    depends_on:
      - db

volumes:
  postgres_data:
x-laravel-env: &laravel-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:2fl+KtvkdphvQyE8mQqGqzqJb0n5nFqJkqYk3n7p0aE=
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is missing - add it to the root .env file}"
  DB_CONNECTION: pgsql
  DB_HOST: db                       # السيرفر الرئيسي افتراضياً
  DB_WRITE_HOST: db                 # سيرفر الكتابة
  DB_READ_HOST: db-replica          # سيرفر القراءة (الـ Replica)
  DB_PORT: 5432
  DB_DATABASE: ecommerce_platform
  DB_USERNAME: postgres
  DB_PASSWORD: secretpassword
  INVENTORY_GRPC_HOST: inventory
  INVENTORY_GRPC_PORT: 9090
  INVENTORY_GRPC_TIMEOUT_MS: 3000
  INVENTORY_DRIVER: grpc
  PERF_DEBUG: "true"
  CACHE_STORE: redis
  SESSION_DRIVER: database
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_VHOST: /
  # Gmail SMTP (قيم من ملف .env بجذر المشروع)
  MAIL_MAILER: smtp
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: 587
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Ecommerce Platform}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ecommerce-app
  REVERB_APP_KEY: ecommerce-key
  REVERB_APP_SECRET: ecommerce-secret
  REVERB_HOST: reverb
  REVERB_PORT: 8085
  REVERB_SCHEME: http

x-laravel-common: &laravel-common
  image: ecommerce-laravel-app:latest
  build:
    context: ./backend/laravel-app
    dockerfile: Dockerfile
  command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
  restart: unless-stopped
  environment:
    <<: *laravel-env
  depends_on:
    db:
      condition: service_healthy
    db-replica:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    inventory:
      condition: service_started
    migrate:
      condition: service_completed_successfully
  volumes:
    - ./backend/laravel-app:/var/www/html
    - laravel_vendor:/var/www/html/vendor
    - ./inventory-service/proto:/proto:ro

x-laravel-worker: &laravel-worker
  image: ecommerce-laravel-app:latest
  command: ["sh", "-c", "php artisan queue:work rabbitmq --queue=emails --sleep=1 --tries=3 --timeout=90 --no-interaction"]
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - ./backend/laravel-app:/var/www/html
    - laravel_vendor:/var/www/html/vendor

services:
  db:
    image: postgres:15-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    # --- Replication: الـ Primary يسمح للـ Replica بنسخ WAL (انظري docker/postgres/primary/pg_hba.conf) ---
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Read Replica حقيقي (Streaming Replication من db) ---
  db-replica:
    image: postgres:15-alpine
    container_name: ecommerce_db_replica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      PRIMARY_HOST: db
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    ports:
      - "5434:5432" # منفذ خارجي مختلف حتى لا يتضارب مع 5432
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_platform"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- Redis للكاش ---
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  inventory-db:
    image: postgres:15-alpine
    container_name: inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory_service
    restart: unless-stopped
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8080
      GRPC_SERVER_PORT: 9090
    ports:
      - "8080:8080"
      - "9090:9090"

  migrate:
    image: ecommerce-laravel-app:latest
    build:
      context: ./backend/laravel-app
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    environment:
      <<: *laravel-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/laravel-app:/var/www/html
      - laravel_vendor:/var/www/html/vendor

  # --- Nginx Load Balancer: Least Connections ---
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started

  app1:
    <<: *laravel-common
    environment:
      <<: *laravel-env
      INSTANCE_NAME: app1
    ports:
      - "8001:8000"

  app2:
    <<: *laravel-common
    environment:
      <<: *laravel-env
      INSTANCE_NAME: app2
    ports:
      - "8002:8000"

  app3:
    <<: *laravel-common
    environment:
      <<: *laravel-env
      INSTANCE_NAME: app3
    ports:
      - "8003:8000"

  # --- Email Queue Workers: 3 workers on the same `emails` queue ---
  # Explicit services (not deploy.replicas) so `docker compose up` starts all 3
  # without Swarm / without manual --scale.
  laravel-queue-emails-1:
    <<: *laravel-worker
    environment:
      <<: *laravel-env
      INVENTORY_DRIVER: fake
      WORKER_NAME: emails-1

  laravel-queue-emails-2:
    <<: *laravel-worker
    environment:
      <<: *laravel-env
      INVENTORY_DRIVER: fake
      WORKER_NAME: emails-2

  laravel-queue-emails-3:
    <<: *laravel-worker
    environment:
      <<: *laravel-env
      INVENTORY_DRIVER: fake
      WORKER_NAME: emails-3

  # --- [غالية] سيرفر WebSocket (Laravel Reverb) ---
  reverb:
    build:
      context: ./backend/laravel-app
      dockerfile: Dockerfile
    container_name: ecommerce_reverb
    command: ["sh", "-c", "php artisan reverb:start --host=0.0.0.0 --port=8085"]
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:2fl+KtvkdphvQyE8mQqGqzqJb0n5nFqJkqYk3n7p0aE=
      REVERB_APP_ID: ecommerce-app
      REVERB_APP_KEY: ecommerce-key
      REVERB_APP_SECRET: ecommerce-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8085
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8085
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/laravel-app:/var/www/html
      - laravel_vendor:/var/www/html/vendor

  # ---  Worker مستقل للبث: يسحب من طابور broadcasts فقط ---
  laravel-queue-broadcasts:
    build:
      context: ./backend/laravel-app
      dockerfile: Dockerfile
    container_name: ecommerce_laravel_queue_broadcasts
    command: ["sh", "-c", "php artisan queue:work rabbitmq --queue=broadcasts --sleep=1 --tries=3 --timeout=90 --no-interaction"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:2fl+KtvkdphvQyE8mQqGqzqJb0n5nFqJkqYk3n7p0aE=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_WRITE_HOST: db
      DB_READ_HOST: db-replica
      DB_PORT: 5432
      DB_DATABASE: ecommerce_platform
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ecommerce-app
      REVERB_APP_KEY: ecommerce-key
      REVERB_APP_SECRET: ecommerce-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8085
      REVERB_SCHEME: http
      INVENTORY_DRIVER: fake
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reverb:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/laravel-app:/var/www/html
      - laravel_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend-part
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_REVERB_APP_KEY: ecommerce-key
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8085"
        VITE_REVERB_SCHEME: http
    container_name: ecommerce_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nginx

  frontend-dev:
    image: node:22-alpine
    container_name: ecommerce_frontend_dev
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_REVERB_APP_KEY: ecommerce-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: "8085"
      VITE_REVERB_SCHEME: http
    volumes:
      - ./frontend-part:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5174:5173"
    depends_on:
      - nginx

volumes:
  postgres_data:
  postgres_replica_data:   
  inventory_postgres_data:
  laravel_vendor:
  frontend_node_modules:
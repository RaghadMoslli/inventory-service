# Overlay: route mail to Mailpit during load tests (avoid flooding Gmail).
x-laravel-env: &laravel-env
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_USERNAME: null
  MAIL_PASSWORD: null
  MAIL_FROM_ADDRESS: loadtest@ecommerce.local
  MAIL_FROM_NAME: LoadTest


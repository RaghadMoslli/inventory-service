syntax = "proto3";
package inventory.v1;

option java_multiple_files = true;
option java_package = "com.shop.inventory.grpc";

service InventoryService {
  rpc GetStock(GetStockRequest) returns (GetStockResponse);   
  rpc Reserve(ReserveRequest) returns (ReserveResponse);     
  rpc Release(ReleaseRequest) returns (ReleaseResponse);     
  rpc SetStock(SetStockRequest) returns (SetStockResponse);   
}

message GetStockRequest  { repeated int64 product_ids = 1; }
message StockItem        { int64 product_id = 1; int32 available = 2; }
message GetStockResponse { repeated StockItem items = 1; }

message ReserveItem      { int64 product_id = 1; int32 quantity = 2; }
message ReserveRequest   { string request_id = 1; repeated ReserveItem items = 2; }
message Shortage         { int64 product_id = 1; int32 requested = 2; int32 available = 3; }
message ReserveResponse  {
  bool success = 1;
  string reservation_id = 2;        
  repeated Shortage shortages = 3;   
}

message ReleaseRequest   { string reservation_id = 1; }
message ReleaseResponse  { bool released = 1; }

message SetStockRequest  { int64 product_id = 1; int32 quantity = 2; }
message SetStockResponse { bool ok = 1; }
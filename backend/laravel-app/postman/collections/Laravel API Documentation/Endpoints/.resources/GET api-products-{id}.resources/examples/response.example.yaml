$kind: http-example
auth:
  type: noauth
request:
  url: "{{baseUrl}}/api/products/:id"
  method: GET
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: id
      value: consequatur
      description: The ID of the product.
response:
  statusCode: 404
  statusText: OK
  headers:
    cache-control: no-cache, private
    content-type: application/json
    access-control-allow-origin: "*"
  body:
    type: text
    content: '{"error":{"code":"NOT_FOUND","message":"\u0627\u0644\u0645\u0646\u062a\u062c \u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f"}}'
order: 1000

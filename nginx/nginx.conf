events {
    worker_connections 1024;
}

http {
    # If the client already sent X-Forwarded-For (tests / upstream proxies), keep it.
    # Otherwise use the connecting address.
    map $http_x_forwarded_for $client_xff {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }

    upstream laravel_backend {
        least_conn;

        server app1:8000 max_fails=2 fail_timeout=10s;
        server app2:8000 max_fails=2 fail_timeout=10s;
        server app3:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://laravel_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $client_xff;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
